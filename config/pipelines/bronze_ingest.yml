name: bronze_ingest
enabled: true
description: >
  Local batch CSV ingest into Bronze Delta (Auto Loader cloudFiles on Databricks).
  Technical columns + CDF + hash idempotency via hc_lakehouse.bronze.
schedule: "0 */6 * * *"
source:
  format: cloudFiles  # local demo uses batch CSV instead
  path_pattern: "landing/**/*.csv"
target:
  schema: bronze
checkpoints:
  root: checkpoints/bronze
pipeline_version: "0.2.0"
