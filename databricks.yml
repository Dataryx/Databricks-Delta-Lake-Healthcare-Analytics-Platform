# Databricks Asset Bundle — Indominus Health Research Lakehouse
bundle:
  name: hc-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name for this environment
  env:
    description: Environment name (dev|test|prod|local)
  small_cell_k:
    description: Small-cell suppression threshold
    default: 11
  notification_email:
    description: Failure notification target (group mailbox)
    default: "hc-platform-oncall@example.invalid"

targets:
  local:
    default: true
    mode: development
    variables:
      catalog: hc_dev
      env: local
    workspace:
      host: https://localhost

  dev:
    mode: development
    variables:
      catalog: hc_dev
      env: dev
    workspace:
      host: ${DATABRICKS_HOST}

  test:
    mode: development
    variables:
      catalog: hc_test
      env: test
    workspace:
      host: ${DATABRICKS_HOST}

  prod:
    mode: production
    variables:
      catalog: hc_prod
      env: prod
    workspace:
      host: ${DATABRICKS_HOST}
    # Manual approval: GitHub Environment `prod` required in CD
