# Databricks Asset Bundle — INDHC lakehouse

bundle:
  name: hc-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name for this target
  env:
    description: Environment (dev | test | prod | local)
  small_cell_k:
    description: Minimum cell size for aggregate disclosure
    default: 11
  notification_email:
    description: On-call mailbox for job failures (override per target; do not commit real addresses)
    default: "SET_NOTIFICATION_EMAIL_IN_TARGET"

targets:
  local:
    default: true
    mode: development
    variables:
      catalog: hc_dev
      env: local
    workspace:
      host: https://localhost

  dev:
    mode: development
    variables:
      catalog: hc_dev
      env: dev
    workspace:
      host: ${DATABRICKS_HOST}

  test:
    mode: development
    variables:
      catalog: hc_test
      env: test
    workspace:
      host: ${DATABRICKS_HOST}

  prod:
    mode: production
    variables:
      catalog: hc_prod
      env: prod
    workspace:
      host: ${DATABRICKS_HOST}
