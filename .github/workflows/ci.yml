# CI — lint, typecheck, tests, PHI scan, grants diff, terraform validate

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,ml]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src/hc_lakehouse
      - name: Unit + privacy tests
        run: pytest tests/unit tests/privacy -q --cov=hc_lakehouse --cov-report=xml
        env:
          HC_RUNTIME_MODE: local
          HC_DEID_SALT: local-demo-pepper-not-for-production
      - name: Integration (Spark + Delta)
        run: pytest tests/integration -q
        env:
          HC_RUNTIME_MODE: local
          HC_DEID_SALT: local-demo-pepper-not-for-production
      - name: PHI scan
        run: python -m hc_lakehouse.privacy.phi_scanner .
      - name: Grants SQL dry-run + diff artifact
        run: |
          python scripts/apply_governance.py
          python - <<'PY'
          from pathlib import Path
          from hc_lakehouse.governance.grants import grants_diff_report
          p = Path("artifacts/governance")
          files = sorted(p.glob("grants_*.sql"))
          assert files, "expected grants SQL artifact"
          print("grants_lines", len(files[0].read_text(encoding="utf-8").splitlines()))
          print("diff_vs_empty", len(grants_diff_report("", files[0].read_text(encoding="utf-8"))))
          PY

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  bundle-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DAB structure check
        run: |
          test -f databricks.yml
          test -f resources/jobs.yml
          test -f resources/pipelines.yml
          test -f pipelines/dlt/bronze_silver_dlt.py
          test -f conf/cluster_policies/hc_job_policy.json
          echo "Asset Bundle resources present (databricks bundle validate requires workspace auth)."
