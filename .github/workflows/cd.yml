# CD — Asset Bundle deploy with environment approval on prod

name: CD

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target (dev|test|prod)
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.240.0
      - name: Bundle deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target }}"
          echo "Deploying Asset Bundle to target=${TARGET}"
          if [[ "${TARGET}" == "prod" ]]; then
            echo "Prod deploy requires GitHub Environment approval + workspace secrets."
          fi
          databricks bundle validate -t "${TARGET}"
          databricks bundle deploy -t "${TARGET}"
